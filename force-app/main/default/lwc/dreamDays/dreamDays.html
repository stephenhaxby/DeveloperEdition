<template>
    <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_medium">
            <lightning-spinner size="small" alternative-text="Loading dream days"></lightning-spinner>
        </div>
    </template>

    <template lwc:elseif={error}>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-text-color_error">
            {error}
        </div>
    </template>

    <template lwc:elseif={hasItems}>
        <div class="slds-p-horizontal_medium list-grid">
            <template for:each={items} for:item="item">
                <lightning-card key={item.id} title={item.title} class="item-card">
                    <div class="slds-p-horizontal_medium details slds-p-bottom_small">
                        <p><strong>Item Date:</strong> {item.itemDateLabel}</p>
                        <p><strong>From Today:</strong> {item.differenceYearLabel}</p>
                        <p>{item.differenceMonthDayLabel}</p>
                    </div>
                    <div slot="actions">
                        <lightning-button-icon
                            icon-name="utility:delete"
                            variant="brand"
                            data-id={item.id}
                            onclick={handleRemove}
                            disabled={isSaving}
                        ></lightning-button-icon>
                    </div>
                </lightning-card>
            </template>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            Add your first DreamDay item.
        </div>
    </template>
    <lightning-accordion allow-multiple-sections-open active-section-name={accordianOpenItems}>
        <lightning-accordion-section name="AddDreamDayItem" label="Add Dream Day Item">
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <div class="form-row">
                    <lightning-input
                        type="text"
                        label="Title"
                        value={newTitle}
                        onchange={handleTitleChange}
                    ></lightning-input>
                </div>
                <div class="form-row">
                        <lightning-input
                        type="date"
                        label="Item Date"
                        value={newItemDate}
                        onchange={handleDateChange}
                    ></lightning-input>
                </div>
                <div class="form-row">
                    <lightning-button
                        class="slds-m-top_small"
                        variant="brand"
                        label="Add"
                        title="Add item"
                        onclick={handleAdd}
                        disabled={disableAdd}
                    ></lightning-button>
                </div>
            </div>
        </lightning-accordion-section>            
    </lightning-accordion>
</template>
